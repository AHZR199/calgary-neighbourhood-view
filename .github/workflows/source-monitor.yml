name: check source updates
on:
  schedule:
    - cron: '15 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/monitor-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-review
          path: work/source-monitor/report.json
